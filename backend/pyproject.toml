[project]
name = "docx-ai-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pgvector>=0.3,<1.0",
    "PyJWT>=2.8,<3.0",
    "bcrypt>=4.1,<5.0",
    "python-multipart>=0.0.20,<1.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -ra"
markers = [
    "unit: fast, isolated tests with no external services",
    "integration: multi-component tests (API + services); no PostgreSQL-specific features",
    "pgvector: require real PostgreSQL with the pgvector extension (set TEST_DATABASE_URL)",
    "e2e: full-stack tests against a running deployment",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
