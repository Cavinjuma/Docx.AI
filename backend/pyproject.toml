[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -ra"
markers = [
    "unit: fast, isolated tests with no external services",
    "integration: multi-component tests (API + services); no PostgreSQL-specific features",
    "pgvector: require real PostgreSQL with the pgvector extension (set TEST_DATABASE_URL)",
    "e2e: full-stack tests against a running deployment",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
